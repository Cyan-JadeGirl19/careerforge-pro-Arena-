services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careerforge
      POSTGRES_PASSWORD: dev_only_change_me
      POSTGRES_DB: careerforge
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      CF_ENVIRONMENT: development
      CF_DATABASE_URL: postgresql+psycopg://careerforge:dev_only_change_me@db:5432/careerforge
      CF_CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build && npm run start"
    volumes:
      - ./apps/web:/app
    environment:
      CF_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  dbdata:
