name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Verify committed contract is current
        working-directory: .
        run: |
          python - <<'EOF'
          import json, subprocess, sys
          sys.path.insert(0, "apps/api")
          from app.main import app
          fresh = app.openapi()
          committed_raw = subprocess.run(
              ["git", "show", "HEAD:docs/openapi/v1.json"],
              capture_output=True, text=True, check=True,
          ).stdout
          committed = json.loads(committed_raw)
          if fresh != committed:
              print("ERROR: docs/openapi/v1.json is stale.")
              print("Run: python apps/api/scripts/export_openapi.py and commit the result.")
              sys.exit(1)
          print("Contract is current.")
          EOF

  web:
    name: Web typecheck + build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
