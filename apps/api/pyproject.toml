[project]
name = "careerforge-api"
version = "0.2.0"
description = "CareerForge Pro API - CV-first career acceleration backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "reportlab>=4.1",
    "python-multipart>=0.0.9",
    # Encrypts the candidate's Gmail refresh token at rest.
    "cryptography>=42",
    # Renders the video intro card (name/role text + headshot) as PNG.
    "pillow>=10",
    # Static ffmpeg binary (bundled in the wheel) for video analysis,
    # enhancement and export. Works in the sandbox, CI and Render without
    # any system-level installation.
    "imageio-ffmpeg>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
